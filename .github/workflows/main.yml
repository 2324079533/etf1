name: Daily ETF Analysis每日ETF分析

on:在:
  workflow_dispatch: {} workflow_dispatch: {}
  schedule:  调度:
    # 早上 8:30 (北京时间) -> UTC 0:30，周一至周五开盘前
    - cron: '30 0 * * 1-5'
    # 下午 17:00 (北京时间) -> UTC 9:00，周一至周五收盘后 (如需 17:30 改为 '30 9 * * 1-5')
    - cron: '0 9 * * 1-5'

jobs:
  run-analysis:  运行分析:
